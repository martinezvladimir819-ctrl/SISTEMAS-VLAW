<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: #e0e0e0;
  }

  .topbar { position: relative; }

  header {
    background: #000;
    color: #fff;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #2ecc71;
  }

  .brand { display: flex; align-items: center; gap: 0.9rem; }

  header h1 { color: #2ecc71; font-size: 1.3rem; }

  .btn {
    background: #2ecc71;
    color: #000;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  .btn:hover { background: #27ae60; }

  .btn-outline {
    background: none;
    border: 1px solid #2ecc71;
    color: #2ecc71;
  }
  .btn-outline:hover { background: rgba(46, 204, 113, 0.12); }

  /* Botón de menú (hamburguesa) */
  .menu-toggle {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 34px;
    height: 34px;
    background: none;
    border: 1px solid #2ecc71;
    border-radius: 6px;
    cursor: pointer;
    padding: 0;
  }
  .menu-toggle .bar {
    display: block;
    width: 18px;
    height: 2px;
    margin: 0 auto;
    background: #2ecc71;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  .menu-toggle[aria-expanded="true"] .bar:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .menu-toggle[aria-expanded="true"] .bar:nth-child(2) { opacity: 0; }
  .menu-toggle[aria-expanded="true"] .bar:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* Menú desplegable de navegación */
  nav.tabs {
    position: absolute;
    top: 100%;
    left: 2rem;
    display: flex;
    flex-direction: column;
    width: 240px;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    background: #111;
    border: 1px solid #2ecc71;
    border-radius: 0 0 10px 10px;
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
    transition: max-height 0.28s ease, opacity 0.2s ease;
    z-index: 60;
  }

  nav.tabs.open {
    max-height: 620px;
    opacity: 1;
    padding: 0.4rem 0;
  }

  nav.tabs button {
    background: none;
    border: none;
    color: #ccc;
    text-align: left;
    padding: 0.7rem 1.1rem;
    cursor: pointer;
    font-size: 0.92rem;
    border-left: 3px solid transparent;
  }

  nav.tabs button:hover { color: #2ecc71; background: rgba(46, 204, 113, 0.06); }
  nav.tabs button.active {
    color: #2ecc71;
    border-left: 3px solid #2ecc71;
    font-weight: bold;
    background: rgba(46, 204, 113, 0.08);
  }

  main {
    max-width: 900px;
    margin: 2rem auto;
    padding: 1.5rem;
    background: #1a1a1a;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(46, 204, 113, 0.1);
    min-height: 50vh;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .tab-content h2 { color: #2ecc71; margin-bottom: 1rem; }
  .tab-content p { line-height: 1.6; margin-bottom: 0.8rem; }

  .rich-layout {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 1.2rem;
    align-items: center;
    margin: 1.2rem 0 1.6rem;
  }

  .text-stack {
    display: grid;
    gap: 1rem;
  }

  .highlight-box {
    background: rgba(46, 204, 113, 0.08);
    border: 1px solid rgba(46, 204, 113, 0.2);
    border-radius: 10px;
    padding: 1rem 1.1rem;
  }

  .highlight-box strong {
    color: #fff;
  }

  .section-quote {
    margin: 1rem 0;
    padding: 1rem 1.1rem;
    border-left: 3px solid #2ecc71;
    background: rgba(255,255,255,0.02);
    color: #d9d9d9;
    font-style: italic;
  }

  .image-panel {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(46, 204, 113, 0.2);
    box-shadow: 0 10px 24px rgba(0,0,0,0.25);
  }

  .image-panel img {
    width: 100%;
    height: 100%;
    min-height: 240px;
    object-fit: cover;
    display: block;
  }
   
  .split-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
  }

  .mini-card {
    background: #111;
    border: 1px solid #222;
    border-radius: 10px;
    padding: 1rem;
  }

  .mini-card h3 {
    color: #2ecc71;
    margin-bottom: 0.4rem;
    font-size: 1rem;
  }

  .mini-card ul {
    list-style: none;
    padding-left: 0;
    color: #d2d2d2;
    line-height: 1.7;
    font-size: 0.9rem;
  }

  .mini-card li::before {
    content: "✓ ";
    color: #2ecc71;
    font-weight: bold;
  }

  .process-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.9rem;
    margin-top: 1rem;
  }

  .step {
    background: #101010;
    border: 1px solid #262626;
    border-radius: 10px;
    padding: 1rem;
    position: relative;
  }

  .step .num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #2ecc71;
    color: #000;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    margin-bottom: 0.6rem;
  }

  .step h3 {
    color: #fff;
    font-size: 0.96rem;
    margin-bottom: 0.35rem;
  }

  .step p {
    font-size: 0.84rem;
    color: #b9b9b9;
    margin-bottom: 0;
  }

  .cta-banner {
    margin-top: 1.4rem;
    padding: 1.1rem 1.2rem;
    background: linear-gradient(135deg, rgba(46,204,113,0.12), rgba(255,255,255,0.02));
    border: 1px solid rgba(46,204,113,0.22);
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
  }

  .user-form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
    margin-top: 1.2rem;
    background: #111;
    border: 1px solid #242424;
    border-radius: 12px;
    padding: 1.2rem;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .field label {
    color: #dcdcdc;
    font-size: 0.85rem;
  }

  .field input,
  .field textarea {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #303030;
    border-radius: 8px;
    color: #fff;
    padding: 0.7rem 0.8rem;
    font: inherit;
  }

  .field textarea {
    min-height: 110px;
    resize: vertical;
  }

  .user-form .full-width {
    grid-column: 1 / -1;
  }

  @media (max-width: 700px) {
    .rich-layout {
      grid-template-columns: 1fr;
    }

    .cta-banner {
      align-items: flex-start;
      flex-direction: column;
    }
  }

  /* ---- Inicio visual (hero, stats, features) ---- */
  .hero { text-align: center; padding: 1rem 0.5rem 2rem; }

  .eyebrow {
    display: inline-block;
    color: #2ecc71;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.72rem;
    font-weight: bold;
    margin-bottom: 0.9rem;
  }

  .hero-title {
    font-size: clamp(1.7rem, 4vw, 2.5rem);
    line-height: 1.18;
    color: #fff;
    font-weight: 800;
    margin-bottom: 1rem;
  }   

  .hero-sub { 
    max-width: 540px;
    margin: 0 auto 1.6rem;
    color: #bbb;
    line-height: 1.65;
  }

  .hero-actions {
    display: flex;
    gap: 0.8rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .wave-divider { line-height: 0; margin: 1.6rem -1.5rem 0; }
  .wave-divider svg { width: 100%; height: 36px; display: block; }
  .wave-divider path { fill: rgba(46, 204, 113, 0.1); }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1rem;
    text-align: center;
    margin: 1.8rem 0 2.2rem;
  }

  .stat-num { display: block; font-size: 1.7rem; font-weight: 800; color: #2ecc71; }
  .stat-label { display: block; font-size: 0.75rem; color: #999; margin-top: 0.25rem; }

  .feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 1.1rem;
  }

  .feature {
    background: #111;
    border: 1px solid #222;
    border-radius: 10px;
    padding: 1.4rem 1.1rem;
    text-align: center;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .feature:hover { border-color: #2ecc71; transform: translateY(-3px); }

  .feature-icon {
    width: 42px;
    height: 42px;
    margin: 0 auto 0.8rem;
    color: #2ecc71;
  }

  .feature h3 { color: #fff; font-size: 1rem; margin-bottom: 0.4rem; }
  .feature p { font-size: 0.85rem; color: #aaa; line-height: 1.55; margin-bottom: 0; }

  footer {
    text-align: center;
    padding: 1rem;
    background: #000;
    color: #777;
    border-top: 2px solid #2ecc71;
  }

  /* Modal de usuarios */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .modal-overlay.active { display: flex; }

  .modal {
    background: #1a1a1a;
    border: 1px solid #2ecc71;
    padding: 2rem;
    border-radius: 8px;
    width: 90%;
    max-width: 350px;
  }

  .modal h2 { color: #2ecc71; margin-bottom: 1rem; }

  .modal input {
    width: 100%;
    padding: 0.6rem;
    margin-bottom: 0.8rem;
    background: #0d0d0d;
    border: 1px solid #333;
    color: #fff;
    border-radius: 4px;
  }

  .modal .switch-link {
    color: #2ecc71;
    cursor: pointer;
    font-size: 0.85rem;
    text-decoration: underline;
  }

  .modal .close-btn {
    background: none;
    border: none;
    color: #aaa;
    float: right;
    cursor: pointer;
    font-size: 1.2rem;
  }

  .msg { font-size: 0.85rem; margin-top: 0.5rem; }
  .msg.error { color: #e74c3c; }
  .msg.success { color: #2ecc71; }

  #userPanel { display: none; align-items: center; gap: 0.8rem; }

  /* Tarjetas dinámicas genéricas (usadas en todas las pestañas) */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
  }

  .info-card {
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 1rem;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .info-card:hover {
    border-color: #2ecc71;
    transform: translateY(-2px);
  }

  .info-card h3 {
    color: #2ecc71;
    margin-bottom: 0.5rem;
    font-size: 1.05rem;
  }

  .info-card p {
    font-size: 0.9rem;
    line-height: 1.5;
    color: #ccc;
    margin-bottom: 0.8rem;
  }

  .info-card .info-btn {
    background: none;
    border: 1px solid #2ecc71;
    color: #2ecc71;
    padding: 0.4rem 0.8rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    width: 100%;
  }

  .info-card .info-btn:hover {
    background: #2ecc71;
    color: #000;
  }

  /* Recuadro dinámico de "más información" */
  .info-box {
    display: none;
    margin-top: 0.8rem;
    padding-top: 0.8rem;
    border-top: 1px dashed #333;
  }

  .info-box.active { display: block; }

  .info-box .detalle-text {
    font-size: 0.87rem;
    line-height: 1.55;
    color: #ccc;
    margin-bottom: 0.4rem;
  }

  .info-box .info-img {
    display: block;
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 0.7rem;
    background: #0d0d0d;
  }

  .info-box .img-credit {
    font-size: 0.7rem;
    color: #666;
    margin-bottom: 0;
  }

  /* Variante acordeón para Preguntas Frecuentes */
  .faq-grid { grid-template-columns: 1fr; }
  .faq-grid .info-card { padding: 0.9rem 1.1rem; }
  .faq-grid .info-card h3 { font-size: 0.95rem; margin-bottom: 0; }
  .faq-grid .info-btn { width: auto; margin-top: 0.6rem; }
</style>
</head>
<body>

<div class="topbar" id="topBar">
  <header>
    <div class="brand">
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú de navegación" aria-expanded="false">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <h1>VLAW, sistemas verdes</h1>
    </div>
    <div id="authArea">
      <button class="btn" id="loginBtn">Iniciar sesión</button>
      <div id="userPanel">
        <span id="userName" style="color:#2ecc71;"></span>
        <button class="btn" id="logoutBtn">Salir</button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabsNav"></nav>
</div>

<main id="contenido"></main>

<footer>
  <p>&copy; 2026 VLAW, sistemas verdes.
    Todos los derechos reservados.</p>
</footer>

<!-- Modal de Login/Registro -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="close-btn" id="closeModal">&times;</button>

    <div id="loginForm">
      <h2>Iniciar sesión</h2>
      <input type="text" id="loginUser" placeholder="Usuario">
      <input type="password" id="loginPass" placeholder="Contraseña">
      <button class="btn" id="loginSubmit" style="width:100%;">Entrar</button>
      <p class="msg" id="loginMsg"></p>
      <p style="margin-top:1rem;">¿No tienes cuenta?
        <span class="switch-link" id="showRegister">Regístrate</span>
      </p>
    </div>

    <div id="registerForm" style="display:none;">
      <h2>Crear cuenta</h2>
      <input type="text" id="regName" placeholder="Nombre completo">
      <input type="email" id="regEmail" placeholder="Correo electrónico">
      <input type="tel" id="regPhone" placeholder="Teléfono">
      <input type="text" id="regCity" placeholder="Ciudad">
      <input type="text" id="regCompany" placeholder="Empresa o proyecto">
      <input type="text" id="regUser" placeholder="Usuario">
      <input type="password" id="regPass" placeholder="Contraseña">
      <button class="btn" id="registerSubmit" style="width:100%;">Registrarme</button>
      <p class="msg" id="registerMsg"></p>
      <p style="margin-top:1rem;">¿Ya tienes cuenta?
        <span class="switch-link" id="showLogin">Inicia sesión</span>
      </p>
    </div>
  </div>
</div>

<script>
  // ---------- Contenido de las 10 pestañas ----------
  const tabs = [
    {
      title: "Inicio",
      content: `

    {
      title: "Sobre Nosotros",
      content: `<h2>Sobre Nosotros</h2>

  const tabsNav = document.getElementById('tabsNav');
  const contenido = document.getElementById('contenido');
  const menuToggle = document.getElementById('menuToggle');

  function cerrarMenu() {
    tabsNav.classList.remove('open');
    menuToggle.setAttribute('aria-expanded', 'false');
  }

  menuToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const abierto = tabsNav.classList.toggle('open');
    menuToggle.setAttribute('aria-expanded', abierto ? 'true' : 'false');
  });

  document.addEventListener('click', (e) => {
    if (!tabsNav.contains(e.target) && !menuToggle.contains(e.target)) {
      cerrarMenu();
    }
  });

  tabs.forEach((tab, i) => {
    const btn = document.createElement('button');
    btn.textContent = tab.title;
    btn.className = i === 0 ? 'active' : '';
    btn.dataset.requiresAuth = tab.requiresAuth ? 'true' : 'false';
    btn.addEventListener('click', () => {
      if (tab.requiresAuth && !usuarioActual) return;
      activarTab(i);
      cerrarMenu();
    });
    tabsNav.appendChild(btn);

    const div = document.createElement('div');
    div.className = 'tab-content' + (i === 0 ? ' active' : '');
    div.innerHTML = tab.content;
    contenido.appendChild(div);
  });

  function syncAuthTabs() {
    const buttons = document.querySelectorAll('nav.tabs button');
    buttons.forEach((btn, i) => {
      const tab = tabs[i];
      const isLocked = !!tab?.requiresAuth && !usuarioActual;
      btn.style.display = isLocked ? 'none' : 'block';
    });

    const visibleTabs = tabs.filter(tab => !(tab.requiresAuth && !usuarioActual));
    if (!usuarioActual && tabs[9] && tabs[9].requiresAuth) {
      activarTab(0);
    } else if (usuarioActual && !visibleTabs.some((tab, idx) => tabs.indexOf(tab) === 0)) {
      activarTab(0);
    }
  }

  document.getElementById('heroContact')?.addEventListener('click', () => activarTab(10));
  document.getElementById('heroContact2')?.addEventListener('click', () => activarTab(10));
  document.getElementById('faqContact')?.addEventListener('click', () => activarTab(10));

  function activarTab(index) {
    document.querySelectorAll('nav.tabs button').forEach((b, i) => {
      b.classList.toggle('active', i === index);
    });
    document.querySelectorAll('.tab-content').forEach((c, i) => {
      c.classList.toggle('active', i === index);
    });
  }

  // Cada pestaña (excepto Inicio) usa este mismo motor para pintar 
  // tarjetas con un recuadro expandible de "más información": texto
  // ampliado + una foto de referencia del tema.
  function crearTarjetas(gridId, items, opciones = {}) {
    const grid = document.getElementById(gridId);
    if (!grid) return;

    const textoBoton = opciones.textoBoton || 'Más información';

    grid.innerHTML = items.map(it => `
      <div class="info-card" data-id="${it.id}">
        <h3>${it.titulo}</h3>
        ${it.resumen ? `<p>${it.resumen}</p>` : ''}
        <button class="info-btn" data-target="info-${gridId}-${it.id}" data-default-text="${textoBoton}">${textoBoton}</button>
        <div class="info-box" id="info-${gridId}-${it.id}">
          ${it.imagen ? `<img class="info-img" src="${it.imagen.src}" alt="${it.imagen.alt}" loading="lazy">` : ''}
          ${it.detalle ? `<p class="detalle-text">${it.detalle}</p>` : ''}
          ${it.imagen ? `<p class="img-credit">Foto: ${it.imagen.credito}</p>` : ''}
        </div>
      </div>
    `).join('');

    // Botón "Más información" / "Ver respuesta": abre/cierra el recuadro de esa tarjeta
    grid.querySelectorAll('.info-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const box = document.getElementById(btn.dataset.target);
        const yaActivo = box.classList.contains('active');
        grid.querySelectorAll('.info-box.active').forEach(b => b.classList.remove('active'));
        grid.querySelectorAll('.info-btn').forEach(b => { b.textContent = b.dataset.defaultText; });
        if (!yaActivo) {
          box.classList.add('active');
          btn.textContent = 'Ocultar';
        }
      });
    });
  }

    { id: 'tiempo', titulo: '¿Cuánto tiempo toma una instalación?',
      detalle: 'Entre 3 y 10 días según el tamaño y la complejidad del proyecto.' },
    { id: 'garantia', titulo: '¿Ofrecen garantía?',
      detalle: 'Sí, todos nuestros sistemas cuentan con 2 años de garantía sobre equipos e instalación.' },
    { id: 'costo', titulo: '¿Cómo se calcula el costo?',
      detalle: 'Depende del área, el tipo de sistema y el terreno. Hacemos una visita técnica gratuita para entregar una cotización precisa.' }
  ], { textoBoton: 'Ver respuesta' });

  crearTarjetas('grid-contacto', [
    { id: 'ventas', titulo: 'Ventas', resumen: 'Cotizaciones y nuevos proyectos.',
      detalle: 'Cuéntanos sobre tu terreno o jardín y te ayudamos a elegir el sistema adecuado. Correo: ventas@vlaw.com',
      imagen: fotoVinedo },
    { id: 'soporte', titulo: 'Soporte Técnico', resumen: 'Ayuda con sistemas ya instalados.',
      detalle: 'Si tienes un sistema VLAW, sistemas verdes y necesitas mantenimiento o revisión, escríbenos. Correo: soporte@vlaw.com',
      imagen: fotoFuga },
    { id: 'oficinas', titulo: 'Oficinas', resumen: 'Armenia,Sonsonate,calle #13.',
      detalle: 'Visítanos con cita previa para conocer nuestros equipos de demostración. Tel: +503 7195 9635',
      imagen: fotoSistema }
  ]);

  // ---------- Sistema de usuarios (en memoria) ----------
  const usuarios = [];
  let usuarioActual = null;

  const modalOverlay = document.getElementById('modalOverlay');
  const loginBtn = document.getElementById('loginBtn');
  const closeModal = document.getElementById('closeModal');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const showRegister = document.getElementById('showRegister');
  const showLogin = document.getElementById('showLogin');
  const userPanel = document.getElementById('userPanel');
  const userNameSpan = document.getElementById('userName');
  const logoutBtn = document.getElementById('logoutBtn');

  function obtenerUsuarioActual() {
    return usuarios.find(u => u.user === usuarioActual) || null;
  }

  function escaparHtml(value = '') {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function renderMiInformacion() {
    const container = document.getElementById('miInfoContainer');
    if (!container) return;

    if (!usuarioActual) {
      container.innerHTML = `
        <div class="highlight-box">
          <p><strong>Sin sesión activa.</strong> Inicia sesión para ver y actualizar tu información personal.</p>
        </div>
      `;
      return;
    }

    const perfil = obtenerUsuarioActual();
    if (!perfil) {
      container.innerHTML = `
        <div class="highlight-box">
          <p><strong>No se encontró tu perfil.</strong> Vuelve a iniciar sesión.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = `
      <div class="user-form">
        <div class="field">
          <label>Nombre completo</label>
          <input type="text" id="infoName" value="${escaparHtml(perfil.name || '')}">
        </div>
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="infoUser" value="${escaparHtml(perfil.user || '')}" readonly>
        </div>
        <div class="field">
          <label>Correo electrónico</label>
          <input type="email" id="infoEmail" value="${escaparHtml(perfil.email || '')}">
        </div>
        <div class="field">
          <label>Teléfono</label>
          <input type="tel" id="infoPhone" value="${escaparHtml(perfil.phone || '')}">
        </div>
        <div class="field">
          <label>Ciudad</label>
          <input type="text" id="infoCity" value="${escaparHtml(perfil.city || '')}">
        </div>
        <div class="field">
          <label>Empresa o proyecto</label>
          <input type="text" id="infoCompany" value="${escaparHtml(perfil.company || '')}">
        </div>
        <div class="field full-width">
          <label>Necesidad o descripción del proyecto</label>
          <textarea id="infoProject">${escaparHtml(perfil.project || '')}</textarea>
        </div>
        <div class="field full-width">
          <button class="btn" id="guardarInfoBtn">Guardar información</button>
        </div>
      </div>
      <p class="msg" id="profileMsg"></p>
    `;

    document.getElementById('guardarInfoBtn')?.addEventListener('click', () => {
      const perfilActual = obtenerUsuarioActual();
      if (!perfilActual) return;

      perfilActual.name = document.getElementById('infoName').value.trim();
      perfilActual.email = document.getElementById('infoEmail').value.trim();
      perfilActual.phone = document.getElementById('infoPhone').value.trim();
      perfilActual.city = document.getElementById('infoCity').value.trim();
      perfilActual.company = document.getElementById('infoCompany').value.trim();
      perfilActual.project = document.getElementById('infoProject').value.trim();

      const msg = document.getElementById('profileMsg');
      if (!perfilActual.name || !perfilActual.email || !perfilActual.phone || !perfilActual.city) {
        msg.textContent = 'Completa nombre, correo, teléfono y ciudad para continuar.';
        msg.className = 'msg error';
        return;
      }

      msg.textContent = 'Tu información se guardó correctamente.';
      msg.className = 'msg success';
      userNameSpan.textContent = `Hola, ${perfilActual.name || perfilActual.user}`;
      renderMiInformacion();
    });
  }

  loginBtn.addEventListener('click', () => modalOverlay.classList.add('active'));
  closeModal.addEventListener('click', () => modalOverlay.classList.remove('active'));

  showRegister.addEventListener('click', () => {
    loginForm.style.display = 'none';
    registerForm.style.display = 'block';
  });

  showLogin.addEventListener('click', () => {
    registerForm.style.display = 'none';
    loginForm.style.display = 'block';
  });

  document.getElementById('registerSubmit').addEventListener('click', () => {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const city = document.getElementById('regCity').value.trim();
    const company = document.getElementById('regCompany').value.trim();
    const user = document.getElementById('regUser').value.trim();
    const pass = document.getElementById('regPass').value.trim();
    const msg = document.getElementById('registerMsg');

    if (!name || !email || !phone || !city || !user || !pass) {
      msg.textContent = 'Completa todos los campos obligatorios.';
      msg.className = 'msg error';
      return;
    }
    if (usuarios.find(u => u.user === user)) {
      msg.textContent = 'Ese usuario ya existe.';
      msg.className = 'msg error';
      return;
    }

    usuarios.push({
      user,
      pass,
      name,
      email,
      phone,
      city,
      company,
      project: ''
    });

    msg.textContent = 'Cuenta creada. Ahora inicia sesión.';
    msg.className = 'msg success';
    document.getElementById('regName').value = '';
    document.getElementById('regEmail').value = '';
    document.getElementById('regPhone').value = '';
    document.getElementById('regCity').value = '';
    document.getElementById('regCompany').value = '';
    document.getElementById('regUser').value = '';
    document.getElementById('regPass').value = '';
  });

  document.getElementById('loginSubmit').addEventListener('click', () => {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    const msg = document.getElementById('loginMsg');

    const encontrado = usuarios.find(u => u.user === user && u.pass === pass);
    if (!encontrado) {
      msg.textContent = 'Usuario o contraseña incorrectos.';
      msg.className = 'msg error';
      return;
    }

    usuarioActual = encontrado.user;
    msg.textContent = '';
    modalOverlay.classList.remove('active');
    mostrarSesionIniciada();
  });

  function mostrarSesionIniciada() {
    const perfil = obtenerUsuarioActual();
    loginBtn.style.display = 'none';
    userPanel.style.display = 'flex';
    userNameSpan.textContent = `Hola, ${perfil ? (perfil.name || perfil.user) : usuarioActual}`;
    syncAuthTabs();
    renderMiInformacion();
    activarTab(9);
  }

  logoutBtn.addEventListener('click', () => {
    usuarioActual = null;
    loginBtn.style.display = 'inline-block';
    userPanel.style.display = 'none';
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    userNameSpan.textContent = '';
    syncAuthTabs();
    renderMiInformacion();
    activarTab(0);
  });

  syncAuthTabs();

  document.getElementById('heroContact')?.addEventListener('click', () => activarTab(10));
  document.getElementById('heroContact2')?.addEventListener('click', () => activarTab(10));
  document.getElementById('faqContact')?.addEventListener('click', () => activarTab(10));
</script>

</body>
</html>
